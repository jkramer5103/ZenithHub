name: CI

# Tests and UI checks on every push and pull request.
# Pushes to main also publish the Docker image to ghcr.io/jkramer5103/zenithhub.
# The image builds while the tests run; "latest" only moves once both have passed.
# Changes that only touch docs skip CI.

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and test Zenith and the manager
        run: ./gradlew build :manager:test

      - name: Check command docs are up to date
        run: ./gradlew updateWiki && git diff --exit-code docs/wiki/Commands.md

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check and build the web UI
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/
            **/build/test-results/

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The GHA layer cache does not persist RUN --mount=type=cache contents.
      # Restore before cache-dance; its post step extracts before cache saves.
      - name: Cache Docker Gradle home
        id: docker-gradle-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/docker-gradle-cache
          key: docker-gradle-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('Dockerfile', '**/*.gradle.kts', 'gradle.properties', 'gradle/**') }}
          restore-keys: |
            docker-gradle-${{ runner.os }}-${{ runner.arch }}-v1-

      - name: Restore Docker Gradle cache mount
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            { "${{ runner.temp }}/docker-gradle-cache": "/root/.gradle" }
          skip-extraction: ${{ steps.docker-gradle-cache.outputs.cache-hit == 'true' }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jkramer5103/zenithhub
          tags: type=sha,format=short

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  latest:
    needs: [check, image]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the tested image as latest
        run: docker buildx imagetools create -t ghcr.io/jkramer5103/zenithhub:latest ghcr.io/jkramer5103/zenithhub@${{ needs.image.outputs.digest }}
