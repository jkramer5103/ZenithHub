# ZenithHub quickstart: runs the image CI publishes from main (x86-64-v3 CPUs).
#
#   docker compose up -d                              start, then open http://<host>:8080
#   docker compose pull && docker compose up -d       update
#
# On ARM or older CPUs, clone the repo and build it yourself (see the README).
services:
  zenith:
    image: ghcr.io/jkramer5103/zenithhub:latest
    container_name: zenithhub
    restart: unless-stopped
    # reaps stray processes and forwards stop signals to the manager
    init: true
    # instances stop gracefully (disconnect, save settings) before the container exits
    stop_grace_period: 60s
    ports:
      # web UI: put it behind your reverse proxy for HTTPS
      - "8080:8080"
      # Minecraft lobby: players join here and pick an instance
      - "25565:25565"
    volumes:
      - ./data:/data
