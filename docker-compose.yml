# Builds the image from this checkout. To run the published image without cloning,
# use quickstart/docker-compose.yml instead.
services:
  zenith:
    build:
      context: .
      args:
        # "native" (x86-64-v3 CPUs, low memory) or "jar" (any CPU, incl. ARM)
        ZENITH_RUNTIME: native
    image: zenithhub:local
    container_name: zenithhub
    restart: unless-stopped
    # reaps stray processes and forwards stop signals to the manager
    init: true
    # instances stop gracefully (disconnect, save settings) before the container exits
    stop_grace_period: 60s
    ports:
      # web UI: put it behind your reverse proxy for HTTPS
      - "8080:8080"
      # Minecraft lobby: players join here and pick an instance
      - "25565:25565"
    volumes:
      - ./data:/data
    # environment:
    #   # turns off KillAura, AutoEat, AntiAFK and the other modules that play for you
    #   ZENITH_DISABLE_CHEATS: "true"
