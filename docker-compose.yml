services:
  zenith:
    build:
      context: .
      args:
        # "native" (x86-64-v3 CPUs, low memory) or "jar" (any CPU, incl. ARM)
        ZENITH_RUNTIME: native
    image: zenithproxy:latest
    container_name: zenith
    restart: unless-stopped
    # reaps stray processes and forwards stop signals to the manager
    init: true
    # instances stop gracefully (disconnect, save settings) before the container exits
    stop_grace_period: 60s
    ports:
      # web UI: put it behind your reverse proxy for HTTPS
      - "8080:8080"
      # Minecraft lobby: players join here and pick an instance (1.21.4 clients)
      - "25565:25565"
    volumes:
      - ./data:/data
